[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-doctor"
version = "0.0.1"
description = "Pre-flight readiness auditor for the four pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
full = [
    "spoke-lint @ git+https://github.com/belarusian/spoke-lint.git",
    "fourseer @ git+https://github.com/belarusian/fourseer.git",
]

[project.scripts]
loop-doctor = "loop_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["loop_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
