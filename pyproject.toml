[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-doctor"
version = "0.0.1"
description = "Pre-flight readiness auditor for the four pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "belarusian" }]
keywords = ["pre-flight", "readiness", "auditor", "ci", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
full = [
    "spoke-lint @ git+https://github.com/belarusian/spoke-lint.git",
    "fourseer @ git+https://github.com/belarusian/fourseer.git",
]

[project.scripts]
loop-doctor = "loop_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/belarusian/loop-doctor"
Repository = "https://github.com/belarusian/loop-doctor"
Documentation = "https://github.com/belarusian/loop-doctor/blob/main/docs/architecture.md"
Issues = "https://github.com/belarusian/loop-doctor/issues"

[tool.setuptools.packages.find]
include = ["loop_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
